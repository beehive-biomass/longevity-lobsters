:root{

  --deep:#15484f;--tide:#3f7f9a;--tide-wash:#e3eff3;
  --kelp:#2f6b4f;--kelp-wash:#e2efe7;
  --coral:#d8472b;--coral-deep:#a83419;--on-coral:#ffffff;
  --shell:#b8865a;--shell-wash:#f3e9db;
  --held:#4f5f8a;--held-wash:#e9ecf4;

*{box-sizing:border-box}
body{margin:0;background:#efe9dd;color:var(--ink);font-family:var(--face);display:flex;justify-content:center}
a{color:var(--tide)}a:hover{color:var(--deep)}
.phone{width:390px;min-height:844px;box-sizing:border-box;padding:18px 18px 0;display:flex;flex-direction:column;gap:12px;background:var(--sand);color:var(--ink);font-size:16px;line-height:1.45}
.tog{display:flex;gap:4px;padding:4px;background:var(--well);border-radius:999px}
.tog button{appearance:none;border:0;margin:0;min-width:44px;height:36px;padding:0 12px;border-radius:999px;background:transparent;color:var(--ink-mut);font:600 14px/1 var(--face);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--deep);color:#ffffff}
.name{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:var(--deep);text-decoration:none;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 14px/1.4 var(--face)}
.chip--sample{background:var(--shell-wash);color:#8a5f36}
.chip--ok{background:var(--kelp-wash);color:var(--kelp)}
.chip--hold{background:var(--held-wash);color:var(--held)}
.chip--tide{background:var(--tide-wash);color:var(--deep)}
.card{box-sizing:border-box;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;box-sizing:border-box;margin:0;padding:8px 16px;border:0;border-top:1px solid var(--line-soft);background:transparent;color:var(--ink);font:500 16px/1.4 var(--face);text-align:start;text-decoration:none}
.row:first-child{border-top:0}
.row-v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-mut);text-align:end}
.held-note{display:flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:8px 14px;border-radius:12px;background:var(--held-wash);color:var(--held);font:600 15px/1.4 var(--face)}
.gauge{display:flex;flex-direction:column;gap:2px;box-sizing:border-box;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.gauge-k{font-size:14px;font-weight:600;color:var(--tide)}
.gauge-v{font-family:var(--display);font-size:32px;line-height:1}
.gauge-n{font-size:14px;color:var(--ink-mut)}
.lane-k{font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--tide);text-transform:uppercase}
.lane-t{font-family:var(--display);font-size:22px;line-height:1.1;color:var(--deep)}
.pill{appearance:none;border:1.5px solid var(--line);margin:0;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);color:var(--ink);font:500 15px/1.2 var(--face);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--coral);background:#fbe6e0;color:var(--coral-deep);font-weight:600}
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;box-sizing:border-box;padding:0 18px;border:0;border-radius:14px;background:var(--coral);color:var(--on-coral);font:600 16px/1.2 var(--face);cursor:pointer}
.btn-primary:hover{background:var(--coral-deep)}
.dots{display:flex;gap:3px;margin:6px 0 2px}
.dots span{flex:1;height:14px;border-radius:4px;background:var(--well)}
.dots .m{background:#e8c9c0}.dots .f{background:var(--tide-wash)}.dots .o{background:var(--coral)}.dots .l{background:var(--shell-wash)}
.dots .today{outline:2.5px solid var(--deep);outline-offset:1.5px}
.dotlegend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-mut)}
.dotlegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.spark{display:block;width:100%;overflow:visible}
.loglist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.loglist .le{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:10px;background:var(--sand);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:-18px;margin-top:auto}
.tabs a{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink-mut)}
.tabs a[aria-current="page"]{color:var(--deep);border-top:2px solid var(--deep)}
.lanehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}

<script>
(function () {
  // language: every translatable element carries data-en / data-th
  var L = localStorage.getItem('lob-lang') || 'en';
  function apply(lang) {
    L = lang; localStorage.setItem('lob-lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.textContent = t;
    });
    document.getElementById('tog-en').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('tog-th').setAttribute('aria-pressed', lang === 'th');
    document.title = lang === 'th' ? 'บ้านร่างกายคุณ · นาฬิกา รอบเดือน เครื่องยนต์' : 'Your hub · the clock, the cycle, the engine';
  }
  document.getElementById('tog-en').onclick = function () { apply('en'); };
  document.getElementById('tog-th').onclick = function () { apply('th'); };

  // cycle strip: 28 days, today = 14
  var cyc = document.getElementById('cycle');
  for (var d = 1; d <= 28; d++) {
    var s = document.createElement('span');
    s.className = d <= 4 ? 'm' : d <= 10 ? 'f' : d <= 15 ? 'o' : 'l';
    if (d === 14) s.classList.add('today');
    cyc.appendChild(s);
  }

  // quick log: pain select + trigger pills + save (real, stored on this device)
  var pain = null, trigs = [];
  document.querySelectorAll('[data-pain]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-pain]').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
      b.setAttribute('aria-pressed', 'true'); pain = b.getAttribute('data-pain');
    };
  });
  document.querySelectorAll('[data-trig]').forEach(function (b) {
    b.onclick = function () {
      var on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', String(!on));
      var label = b.textContent;
      trigs = on ? trigs.filter(function (t) { return t !== label; }) : trigs.concat([label]);
    };
  });
  function renderLogs() {
    var logs = JSON.parse(localStorage.getItem('lob-cycle-log') || '[]');
    var el = document.getElementById('loglist');
    el.innerHTML = '';
    logs.slice(-3).reverse().forEach(function (e) {
      var div = document.createElement('div');
      div.className = 'le';
      var when = new Date(e.t).toLocaleDateString(L === 'th' ? 'th-TH' : 'en-GB', { day: 'numeric', month: 'short' });
      div.innerHTML = '<span>' + when + ' · ' + (L === 'th' ? 'ปวด' : 'pain') + ' ' + e.pain + '</span><span>' + (e.trigs.length ? e.trigs.join(' · ') : (L === 'th' ? 'ไม่มีตัวกระตุ้น' : 'no triggers')) + '</span>';
      el.appendChild(div);
    });
  }
  document.getElementById('logsave').onclick = function () {
    if (pain === null) { pain = '0'; }
    var logs = JSON.parse(localStorage.getItem('lob-cycle-log') || '[]');
    logs.push({ t: Date.now(), pain: pain, trigs: trigs.slice() });
    localStorage.setItem('lob-cycle-log', JSON.stringify(logs));
    document.querySelectorAll('[data-pain],[data-trig]').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
    pain = null; trigs = [];
    renderLogs();
  };
  renderLogs();
  apply(L);
})();
</script>
