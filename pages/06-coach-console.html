<style>/* LONGevity LOBsters · the coach console. same tokens as the genesis boards. */
@font-face{font-family:'Sarabun';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/444ccfffc6e9.woff2) format('woff2');unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}

@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/5f2b031bab77.woff2) format('woff2');unicode-range:U+02D7,U+0303,U+0331,U+0E01-0E5B,U+200C-200D,U+25CC}
@font-face{font-family:'Sarabun';font-style:normal;font-weight:600;font-display:swap;src:url(../assets/f7ce52775a10.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:400;font-display:swap;src:url(../assets/a30ddcd34970.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Manrope';font-style:normal;font-weight:500 700;font-display:swap;src:url(../assets/a30ddcd34970.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 500;font-display:swap;src:url(../assets/83c005d49d8a.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --sand:#f6f1e8;--card:#ffffff;--well:#ece5d8;--line:#e1d9cb;--line-soft:#ede7dc;
  --ink:#0e1f24;--ink-mut:#4b5f63;--ink-dim:#6b7a7d;
  --deep:#15484f;--tide:#3f7f9a;--tide-wash:#e3eff3;
  --kelp:#2f6b4f;--kelp-wash:#e2efe7;
  --coral:#d8472b;--coral-deep:#a83419;--on-coral:#ffffff;
  --shell:#b8865a;--shell-wash:#f3e9db;
  --held:#4f5f8a;--held-wash:#e9ecf4;
  --face:"Manrope","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"DM Serif Display","Sarabun",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#efe9dd;color:var(--ink);font-family:var(--face);display:flex;justify-content:center}
a{color:var(--tide)}a:hover{color:var(--deep)}
.phone{width:390px;min-height:844px;box-sizing:border-box;padding:18px 18px 0;display:flex;flex-direction:column;gap:12px;background:var(--sand);color:var(--ink);font-size:16px;line-height:1.45}
.tog{display:flex;gap:4px;padding:4px;background:var(--well);border-radius:999px}
.tog button{appearance:none;border:0;margin:0;min-width:44px;height:36px;padding:0 12px;border-radius:999px;background:transparent;color:var(--ink-mut);font:600 14px/1 var(--face);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--deep);color:#ffffff}
.name{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:var(--deep);text-decoration:none;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 14px/1.4 var(--face)}
.chip--sample{background:var(--shell-wash);color:#8a5f36}
.chip--ok{background:var(--kelp-wash);color:var(--kelp)}
.chip--hold{background:var(--held-wash);color:var(--held)}
.chip--red{background:#fbe6e0;color:var(--coral-deep)}
.card{box-sizing:border-box;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;box-sizing:border-box;margin:0;padding:8px 16px;border:0;border-top:1px solid var(--line-soft);background:transparent;color:var(--ink);font:500 16px/1.4 var(--face);text-align:start;text-decoration:none}
.row:first-child{border-top:0}
.row-v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-mut);text-align:end}
.gauge{display:flex;flex-direction:column;gap:2px;box-sizing:border-box;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.gauge-k{font-size:14px;font-weight:600;color:var(--tide)}
.gauge-v{font-family:var(--display);font-size:32px;line-height:1}
.gauge-n{font-size:14px;color:var(--ink-mut)}
.avatar{flex:none;width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 16px/1 var(--face);color:#fff}
.client{border-top:1px solid var(--line-soft)}
.client:first-child{border-top:0}
.chead{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border:0;background:transparent;text-align:start;cursor:pointer}
.chead:hover{background:var(--sand)}
.cname{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cwhy{font-size:13px;color:var(--ink-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbody{display:none;padding:4px 14px 14px;flex-direction:column;gap:8px}
.client.open .cbody{display:flex}
.spark{display:block;width:100%;overflow:visible}
.notebox{box-sizing:border-box;width:100%;min-height:60px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sand);color:var(--ink);font:400 15px/1.4 var(--face);resize:vertical}
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;box-sizing:border-box;padding:0 18px;border:0;border-radius:14px;background:var(--coral);color:var(--on-coral);font:600 16px/1.2 var(--face);cursor:pointer}
.btn-primary:hover{background:var(--coral-deep)}
.btn-quiet{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--tide);font:600 15px/1.2 var(--face);cursor:pointer;text-decoration:none}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:-18px;margin-top:auto}
.tabs a{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink-mut)}
.tabs a[aria-current="page"]{color:var(--deep);border-top:2px solid var(--deep)}
.nudge{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--tide-wash)}
.nudge pre{margin:0;white-space:pre-wrap;font:400 14px/1.5 var(--face);color:var(--ink)}
.dots7{display:flex;gap:4px;align-items:center}
.dots7 i{width:9px;height:9px;border-radius:50%;background:var(--kelp)}
.dots7 i.off{background:var(--line)}
</style>

<body>
<div class="phone">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <a href="03-1-the-gift.html" class="name" style="font-size:18px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9" stroke="#d8472b"></path><path d="M12 8a4 4 0 1 0 4 4" stroke="#2f6b4f"></path></svg>LONGevity LOBsters</a>
    <div class="tog"><button type="button" id="tog-en" aria-pressed="true">EN</button><button type="button" id="tog-th" aria-pressed="false">ไทย</button></div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
    <span style="font-family:var(--display);font-size:28px;line-height:1.1;color:var(--deep)" data-en="The coach's morning" data-th="เช้าของโค้ช"></span>
    <span class="chip chip--sample" data-en="sample data" data-th="ข้อมูลตัวอย่าง"></span>
  </div>
  <div style="font-size:14.5px;color:var(--ink-mut)" data-en="Every wearable already reported. You don't read 24 dashboards — the flags come to you." data-th="ข้อมูลจากนาฬิกาทุกเรือนส่งมาแล้ว คุณไม่ต้องเปิด 24 แดชบอร์ด — แฟลกเด้งมาหาคุณเอง"></div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
    <div class="gauge"><span class="gauge-k" data-en="Ready" data-th="พร้อม"></span><span class="gauge-v" style="color:var(--kelp)">18</span><span class="gauge-n" data-en="train as planned" data-th="เทรนตามแผน"></span></div>
    <div class="gauge"><span class="gauge-k" data-en="Watch" data-th="เฝ้าดู"></span><span class="gauge-v" style="color:var(--shell)">4</span><span class="gauge-n" data-en="dial back" data-th="ลดแรงลง"></span></div>
    <div class="gauge"><span class="gauge-k" data-en="Rest" data-th="พัก"></span><span class="gauge-v" style="color:var(--coral)">2</span><span class="gauge-n" data-en="you call today" data-th="ต้องทักวันนี้"></span></div>
  </div>

  <div class="list" id="roster"></div>

  <div class="card" style="display:flex;flex-direction:column;gap:8px;padding:14px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <span style="font-weight:700" data-en="Morning scan" data-th="สแกนเช้า"></span>
      <span style="font-size:13px;color:var(--ink-mut)" id="scantime"></span>
    </div>
    <div style="font-size:14.5px;color:var(--ink-mut)" data-en="Open the reds, send their LINE nudge, close them. Five minutes, twenty-four clients, zero spreadsheets." data-th="เปิดตัวแดง ส่งข้อความไลน์ ปิดจบ — ห้านาที ยี่สิบสี่ลูกค้า ไม่ต้องมีสเปรดชีต"></div>
    <button class="btn-primary" type="button" id="scandone" data-en="Scan done · 5 min" data-th="สแกนเสร็จ · 5 นาที"></button>
  </div>

  <div class="tabs">
    <a href="03-7-me-telemetry.html" data-en="Me" data-th="ฉัน"></a>
    <a href="05-your-hub.html" data-en="Hub" data-th="บ้าน"></a>
    <a href="06-coach-console.html" aria-current="page" data-en="Coach" data-th="โค้ช"></a>
    <a href="07-the-return.html" data-en="Return" data-th="ผลตอบแทน"></a>
  </div>
</div>

<script>
(function () {
  var L = localStorage.getItem('lob-lang') || 'en';
  function T(en, th) { return L === 'th' ? th : en; }
  function apply(lang) {
    L = lang; localStorage.setItem('lob-lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.textContent = t;
    });
    document.getElementById('tog-en').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('tog-th').setAttribute('aria-pressed', lang === 'th');
    document.title = lang === 'th' ? 'เช้าของโค้ช · สแกนห้านาที' : "The coach's morning · five-minute scan";
    render();
  }

  // roster: wearable-derived flags (sample). hrvd = HRV vs personal baseline, slp = hours, cd = cycle day, adh = 7-day adherence dots
  var ROSTER = [
    { id: 'ploy', th: 'พลอย', en: 'Ploy', color: '#3f7f9a', hrvd: -4, slp: 7.4, cd: 9,  adh: [1,1,1,1,1,1,1],
      why: { en: 'all steady', th: 'ทุกค่านิ่ง' }, status: 'ok',
      spark: [30,28,29,31,30,32,31],
      nudge: null },
    { id: 'fah', th: 'ฟ้า', en: 'Fah', color: '#2f6b4f', hrvd: +6, slp: 8.1, cd: 21, adh: [1,1,0,1,1,1,1],
      why: { en: 'HRV above baseline', th: 'HRV สูงกว่าค่าตั้งต้น' }, status: 'ok',
      spark: [26,27,29,28,31,32,34],
      nudge: { en: 'You\u2019re absorbing the zone-2 block well \u2014 we add 10 min tomorrow. Sleep is doing the heavy lifting, keep protecting it 🦞',
               th: 'ร่างรับโซน 2 ได้ดีมาก — พรุ่งนี้เพิ่ม 10 นาที การนอนช่วยหนักแน่น เฝ้าๆ มันไว้นะ 🦞' } },
    { id: 'nam', th: 'น้ำ', en: 'Nam', color: '#b8865a', hrvd: -18, slp: 4.8, cd: 24, adh: [1,0,0,1,0,1,1],
      why: { en: 'HRV −18% · sleep 4:48 · luteal', th: 'HRV −18% · นอน 4:48 · เฟสหลังตกไข่' }, status: 'red',
      spark: [32,30,31,26,24,21,19],
      nudge: { en: 'Today is a full rest day \u2014 no gym, no guilt. Morning walk 20 min, early dinner, lights out by 22:30. Your body is doing hard work this week; we train around it, not through it 🦞',
               th: 'วันนี้พักเต็มวันนะ ไม่ต้องไปยิม ไม่ผิดเลย — เดินเช้า 20 นาที กินข้าวเย็นเร็ว แล้วนอนก่อน 22:30 ร่างกำลังทำงานหนักอยู่แล้วสัปดาห์นี้ เราเทรนแบบเกรงใจมัน 🦞' } },
    { id: 'ice', th: 'ไอซ์', en: 'Ice', color: '#4f5f8a', hrvd: -11, slp: 6.2, cd: null, adh: [1,1,1,0,1,1,0],
      why: { en: 'HRV −11% · 2 missed sessions', th: 'HRV −11% · ขาด 2 เซสชัน' }, status: 'watch',
      spark: [28,29,27,26,25,25,24],
      nudge: { en: 'Dial today back one notch \u2014 zone 2 easy 25 min instead of the intervals. Consistency beats intensity this week 🦞',
               th: 'วันนี้ลดหนึ่งเฟส — โซน 2 เบา ๆ 25 นาที แทนอินเทอร์วัล สัปดาห์นี้สม่ำเสมอสำคัญกว่าหนัก 🦞' } },
    { id: 'praew', th: 'แพรว', en: 'Praew', color: '#d8472b', hrvd: -2, slp: 7.9, cd: 6, adh: [1,1,1,1,1,1,0],
      why: { en: 'period day 6 · moving well', th: 'วันสุดท้ายประจำเดือน · ร่างกลับมาดี' }, status: 'ok',
      spark: [27,27,28,28,29,29,30],
      nudge: null },
    { id: 'bam', th: 'แบม', en: 'Bam', color: '#8a5f36', hrvd: -24, slp: 5.5, cd: 26, adh: [0,0,1,0,0,1,0],
      why: { en: 'flare logged · sleep 5:30 · luteal', th: 'บันทึกอาการกำเริบ · นอน 5:30 · เฟสหลังตกไข่' }, status: 'red',
      spark: [30,28,25,22,20,18,16],
      nudge: { en: 'Heat, 20 min walk, and cancel everything that isn\u2019t sleep. I logged the flare pattern \u2014 we show your doctor the 90-day view at the next visit. You don\u2019t have to push through alone 🦞',
               th: 'ประคบอุ่น เดิน 20 นาที แล้วยกเลิกทุกอย่างที่ไม่ใช่การนอน ฉันบันทึกแพตเทิร์นไว้แล้ว — คราวหน้าเอาข้อมูล 90 วันไปโชว์หมอด้วยกัน ไม่ต้องอดทนคนเดียวนะ 🦞' } }
  ];

  function spark(points, color, w) {
    var min = Math.min.apply(null, points), max = Math.max.apply(null, points);
    var span = (max - min) || 1;
    var step = w / (points.length - 1);
    var coords = points.map(function (p, i) {
      return Math.round(i * step) + ',' + Math.round(28 - ((p - min) / span) * 20);
    }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + w + ' 32" height="32" aria-hidden="true"><polyline points="' + coords + '" fill="none" stroke="' + color + '" stroke-width="2.2" stroke-linecap="round"></polyline><circle cx="' + (w) + '" cy="' + coords.split(' ').pop().split(',')[1] + '" r="3" fill="#d8472b"></circle></svg>';
  }

  function notes(id) { return localStorage.getItem('lob-note-' + id) || ''; }

  function render() {
    var host = document.getElementById('roster');
    host.innerHTML = '';
    ROSTER.forEach(function (c) {
      var div = document.createElement('div');
      div.className = 'client' + (c.status === 'red' ? ' open' : '');
      var chip = c.status === 'ok' ? '<span class="chip chip--ok">' + T('ready', 'พร้อม') + '</span>'
        : c.status === 'watch' ? '<span class="chip chip--hold">' + T('watch', 'เฝ้าดู') + '</span>'
        : '<span class="chip chip--red">' + T('rest · call', 'พัก · ต้องทัก') + '</span>';
      var adh = '<span class="dots7" title="' + T('7-day protocol adherence', 'การทำตามโปรแกรม 7 วัน') + '">' + c.adh.map(function (a) { return '<i class="' + (a ? '' : 'off') + '"></i>'; }).join('') + '</span>';
      div.innerHTML =
        '<button type="button" class="chead">' +
          '<span class="avatar" style="background:' + c.color + '">' + (L === 'th' ? c.th : c.en).slice(0, 1) + '</span>' +
          '<span class="cname"><span style="font-weight:600">' + (L === 'th' ? c.th + ' · ' + c.en : c.en + ' · ' + c.th) + '</span>' +
          '<span class="cwhy">' + c.why[L] + '</span></span>' + chip +
        '</button>' +
        '<div class="cbody">' +
          '<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">' +
            '<div class="gauge" style="border-radius:12px;padding:8px 10px"><span class="gauge-k">HRV</span><span style="font:700 18px/1.2 var(--mono)">' + (c.hrvd > 0 ? '+' : '') + c.hrvd + '%</span><span class="gauge-n" style="font-size:12.5px">' + T('vs baseline', 'เทียบค่าตั้งต้น') + '</span></div>' +
            '<div class="gauge" style="border-radius:12px;padding:8px 10px"><span class="gauge-k">' + T('Sleep', 'นอน') + '</span><span style="font:700 18px/1.2 var(--mono)">' + c.slp.toFixed(1) + ' h</span><span class="gauge-n" style="font-size:12.5px">' + T('last night', 'คืนที่ผ่านมา') + '</span></div>' +
            '<div class="gauge" style="border-radius:12px;padding:8px 10px"><span class="gauge-k">' + T('Cycle', 'รอบ') + '</span><span style="font:700 18px/1.2 var(--mono)">' + (c.cd ? 'd ' + c.cd : '—') + '</span><span class="gauge-n" style="font-size:12.5px">' + (c.cd && c.cd > 20 ? T('luteal', 'หลังตกไข่') : T('this month', 'เดือนนี้')) + '</span></div>' +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:10px">' + spark(c.spark, c.color, 150) + adh + '</div>' +
          (c.nudge ? '<div class="nudge"><span style="font-size:13px;font-weight:700;color:var(--deep)">' + T('Suggested LINE nudge', 'ข้อความไลน์ที่แนะนำ') + '</span><pre>' + c.nudge[L] + '</pre>' +
            '<button type="button" class="btn-quiet" data-copy="' + c.id + '">⧉ ' + T('copy for LINE', 'คัดลอกไปส่งไลน์') + '</button></div>' : '') +
          '<textarea class="notebox" data-note="' + c.id + '" placeholder="' + T('your note (stays on this device)', 'โน้ตของคุณ (เก็บในเครื่องนี้)') + '">' + notes(c.id) + '</textarea>' +
        '</div>';
      host.appendChild(div);
    });
    document.querySelectorAll('.chead').forEach(function (b) {
      b.onclick = function () { b.parentElement.classList.toggle('open'); };
    });
    document.querySelectorAll('[data-copy]').forEach(function (b) {
      b.onclick = function () {
        var c = ROSTER.filter(function (r) { return r.id === b.getAttribute('data-copy'); })[0];
        var text = (c.nudge ? c.nudge[L] : '') ;
        if (navigator.clipboard) navigator.clipboard.writeText(text).then(function () { b.textContent = '✓ ' + T('copied', 'คัดลอกแล้ว'); });
        else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); b.textContent = '✓ ' + T('copied', 'คัดลอกแล้ว'); }
      };
    });
    document.querySelectorAll('[data-note]').forEach(function (ta) {
      ta.addEventListener('input', function () { localStorage.setItem('lob-note-' + ta.getAttribute('data-note'), ta.value); });
    });
  }

  var done = localStorage.getItem('lob-scan-day');
  function refreshScan() {
    var t = document.getElementById('scantime');
    var today = new Date().toISOString().slice(0, 10);
    if (done === today) t.textContent = T('done today ✓', 'วันนี้เสร็จแล้ว ✓');
    else t.textContent = '';
  }
  document.getElementById('scandone').onclick = function () {
    var today = new Date().toISOString().slice(0, 10);
    localStorage.setItem('lob-scan-day', today); done = today; refreshScan();
  };
  refreshScan();

  document.getElementById('tog-en').onclick = function () { apply('en'); };
  document.getElementById('tog-th').onclick = function () { apply('th'); };
  apply(L);
})();
</script>
</body>
</html>
