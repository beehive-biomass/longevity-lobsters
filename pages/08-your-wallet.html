:root{
  --sand:#f6f1e8;--card:#ffffff;--well:#ece5d8;--line:#e1d9cb;--line-soft:#ede7dc;
  --ink:#0e1f24;--ink-mut:#4b5f63;--ink-dim:#6b7a7d;
  --deep:#15484f;--tide:#3f7f9a;--tide-wash:#e3eff3;
  --kelp:#2f6b4f;--kelp-wash:#e2efe7;
  --coral:#d8472b;--coral-deep:#a83419;--on-coral:#ffffff;
  --shell:#b8865a;--shell-wash:#f3e9db;
  --held:#4f5f8a;--held-wash:#e9ecf4;
  --face:"Manrope","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"DM Serif Display","Sarabun",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#efe9dd;color:var(--ink);font-family:var(--face);display:flex;justify-content:center}
a{color:var(--tide)}a:hover{color:var(--deep)}
.phone{width:390px;min-height:844px;box-sizing:border-box;padding:18px 18px 0;display:flex;flex-direction:column;gap:12px;background:var(--sand);color:var(--ink);font-size:16px;line-height:1.45}
.tog{display:flex;gap:4px;padding:4px;background:var(--well);border-radius:999px}
.tog button{appearance:none;border:0;margin:0;min-width:44px;height:36px;padding:0 12px;border-radius:999px;background:transparent;color:var(--ink-mut);font:600 14px/1 var(--face);cursor:pointer}
.tog button[aria-pressed="true"]{background:var(--deep);color:#ffffff}
.name{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);color:var(--deep);text-decoration:none;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:600 14px/1.4 var(--face)}
.chip--sample{background:var(--shell-wash);color:#8a5f36}
.chip--ok{background:var(--kelp-wash);color:var(--kelp)}
.chip--tide{background:var(--tide-wash);color:var(--deep)}
.card{box-sizing:border-box;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;box-sizing:border-box;margin:0;padding:8px 16px;border:0;border-top:1px solid var(--line-soft);background:transparent;color:var(--ink);font:500 16px/1.4 var(--face);text-align:start;text-decoration:none}
.row:first-child{border-top:0}
.row-v{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-mut);text-align:end}
.held-note{display:flex;align-items:center;gap:10px;min-height:44px;box-sizing:border-box;padding:8px 14px;border-radius:12px;background:var(--held-wash);color:var(--held);font:600 15px/1.4 var(--face)}
.btn-primary{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;box-sizing:border-box;padding:0 18px;border:0;border-radius:14px;background:var(--coral);color:var(--on-coral);font:600 16px/1.2 var(--face);cursor:pointer;text-decoration:none}
.btn-primary:hover{background:var(--coral-deep)}
.btn-quiet{display:inline-flex;align-items:center;min-height:44px;padding:0 4px;border:0;background:transparent;color:var(--tide);font:600 15px/1.2 var(--face);cursor:pointer;text-decoration:none}
.pill{appearance:none;border:1.5px solid var(--line);margin:0;min-height:40px;padding:0 14px;border-radius:999px;background:var(--card);color:var(--ink);font:500 15px/1.2 var(--face);cursor:pointer}
.pill[aria-pressed="true"]{border-color:var(--coral);background:#fbe6e0;color:var(--coral-deep);font-weight:600}
.chaindot{flex:none;width:10px;height:10px;border-radius:50%}
.addr{font-family:var(--mono);font-size:13px;color:var(--ink-mut);word-break:break-all}
.seedflow{display:flex;flex-direction:column;gap:6px}
.sfbox{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--sand);border:1px solid var(--line);font-size:14px}
.sfarrow{align-self:center;color:var(--ink-dim);font-size:14px;line-height:1}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--line);margin-inline:-18px;margin-top:auto}
.tabs a{min-height:56px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink-mut)}
.tabs a[aria-current="page"]{color:var(--deep);border-top:2px solid var(--deep)}

<div class="phone">

    <div class="tog"><button type="button" id="tog-en" aria-pressed="true">EN</button><button type="button" id="tog-th" aria-pressed="false">ไทย</button></div>

  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
    <span style="font-family:var(--display);font-size:28px;line-height:1.1;color:var(--deep)" data-en="Your wallet" data-th="กระเป๋าของคุณ"></span>
    <span class="chip chip--sample" data-en="sample data" data-th="ข้อมูลตัวอย่าง"></span>

  <!-- how one key becomes four wallets -->
  <div class="card seedflow">
    <div class="sfbox">🌱<span><b data-en="Your seed phrase" data-th="ซีดเฟรสของคุณ"></b> · <span style="color:var(--ink-mut)" data-en="12 words, written on paper, never a screenshot" data-th="12 คำ จดบนกระดาษ ห้ามถ่ายรูปเก็บ"></span></span></div>
    <div class="sfarrow">↓</div>
    <div style="display:flex;gap:6px">
      <div class="sfbox" style="flex:1">🔐 <span data-en="Solana key" data-th="คีย์ Solana"></span></div>
      <div class="sfbox" style="flex:1">🔐 <span data-en="EVM key" data-th="คีย์ EVM"></span></div>
    </div>
    <div class="sfarrow">↓</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <span class="chip chip--tide"><i class="chaindot" style="background:#9945FF"></i>Solana</span>
      <span class="chip chip--tide"><i class="chaindot" style="background:#F0B90B"></i>BNB Chain</span>
      <span class="chip chip--tide"><i class="chaindot" style="background:#0052FF"></i>Base</span>
      <span class="chip chip--tide"><i class="chaindot" style="background:#12AAFF"></i>Arbitrum</span>
    </div>
    <div style="font-size:13.5px;color:var(--ink-mut)" data-en="BNB · Base · Arbitrum share one address — they are all EVM. Solana gets its own." data-th="BNB · Base · Arbitrum ใช้ที่อยู่เดียวกัน — เป็น EVM ทั้งหมด ส่วน Solana มีที่อยู่แยกของตัวเอง"></div>
  </div>

  <!-- balances -->
  <div class="list" id="chains"></div>

  <!-- receive -->
  <div class="card" style="display:flex;flex-direction:column;gap:10px">
    <span style="font-weight:700" data-en="Receive" data-th="รับเงิน"></span>
    <div style="display:flex;gap:6px;flex-wrap:wrap" id="chainpills"></div>
    <div class="addr" id="fulladdr" style="font-size:14px"></div>
    <button class="btn-primary" type="button" id="copyaddr" data-en="⧉ Copy address" data-th="⧉ คัดลอกที่อยู่"></button>
    <div style="font-size:13.5px;color:var(--ink-mut)" data-en="Share this address to get paid. Check the chain twice before sending." data-th="ส่งที่อยู่นี้ให้คนจะจ่ายเงิน แล้วเช็กเชนให้ชัวร์ทุกครั้งก่อนโอน"></div>
  </div>

  <!-- payments -->
  <div class="card" style="padding:12px 14px;background:var(--tide-wash);border-color:var(--tide);display:flex;flex-direction:column;gap:4px">
    <div style="font-weight:700;font-size:15px;color:var(--deep)" data-en="Where roster payments land" data-th="ที่ที่ค่าโค้ชไหลมา"></div>
    <div style="font-size:14.5px;color:var(--ink-mut)" data-en="Coaching dues and your hive share arrive as USDC, on whichever of the four chains you choose. No bank in the middle, no payout delays." data-th="ค่าโค้ชและส่วนแบ่งรัง ส่งมาเป็น USDC บนเชนที่คุณเลือกจากทั้งสี่ ไม่ต้องผ่านธนาคาร ไม่มีดีเลย์"></div>
  </div>

  <div class="held-note">🛡️<span data-en="Your key is held only by you. A lost key is lost — write the seed on paper, never screenshot it, and no one can restore it but you." data-th="คีย์มีแต่คุณที่ถือ ถ้าหายคือหาย — จดซีดลงกระดาษ ห้ามถ่ายรูป ไม่มีใครกู้คืนให้ได้นอกจากคุณ"></span></div>

<script>
(function () {
  var L = localStorage.getItem('lob-lang') || 'en';
  function T(en, th) { return L === 'th' ? th : en; }

  var SOL = 'LobStR7kQvGm2pN9eRtZ4aWcD8fU3hj6sYbB1nM5vKqE2r';
  var EVM = '0x10b41a7c8e2f94d3b6a5c81f0e7d29b4a6f83c5d';
  var CHAINS = [
    { id: 'sol',  name: 'Solana',    dot: '#9945FF', addr: SOL, short: SOL.slice(0, 6) + '…' + SOL.slice(-4), bal: '0.00 SOL' },
    { id: 'bnb',  name: 'BNB Chain', dot: '#F0B90B', addr: EVM, short: EVM.slice(0, 6) + '…' + EVM.slice(-4), bal: '0.00 BNB' },
    { id: 'base', name: 'Base',      dot: '#0052FF', addr: EVM, short: EVM.slice(0, 6) + '…' + EVM.slice(-4), bal: '12.00 USDC' },
    { id: 'arb',  name: 'Arbitrum',  dot: '#12AAFF', addr: EVM, short: EVM.slice(0, 6) + '…' + EVM.slice(-4), bal: '0.00 ETH' }
  ];

  function apply(lang) {
    L = lang; localStorage.setItem('lob-lang', lang);
    document.documentElement.setAttribute('data-lang', lang);
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var t = el.getAttribute('data-' + lang);
      if (t !== null) el.textContent = t;
    });
    document.getElementById('tog-en').setAttribute('aria-pressed', lang === 'en');
    document.getElementById('tog-th').setAttribute('aria-pressed', lang === 'th');
    document.title = lang === 'th' ? 'กระเป๋าของคุณ · สี่เชน คีย์เดียว' : 'Your wallet · four chains, one key';
    render();
  }

  var selected = localStorage.getItem('lob-chain') || 'base';

  function render() {
    var list = document.getElementById('chains');
    list.innerHTML = '';
    CHAINS.forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'row';
      var note = c.id === 'base' ? T('first roster payment', 'ค่าโค้ชงวดแรก') : (c.id === 'sol' ? T('own address format', 'ฟอร์แมตที่อยู่ของตัวเอง') : T('same as EVM key', 'ร่วมคีย์ EVM ชุดเดียว'));
      d.innerHTML = '<span style="display:flex;align-items:center;gap:10px;min-width:0"><i class="chaindot" style="background:' + c.dot + '"></i><span style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-weight:600">' + c.name + '</span><span style="font-family:var(--mono);font-size:12.5px;color:var(--ink-dim)">' + c.short + '</span></span></span>' +
        '<span class="row-v" style="flex-direction:column;align-items:flex-end;gap:1px">' + c.bal + '<span style="font-weight:500;font-size:12px;color:var(--ink-dim)">' + note + '</span></span>';
      list.appendChild(d);
    });
    var pills = document.getElementById('chainpills');
    pills.innerHTML = '';
    CHAINS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pill';
      b.setAttribute('aria-pressed', String(c.id === selected));
      b.textContent = c.name;
      b.onclick = function () { selected = c.id; localStorage.setItem('lob-chain', selected); render(); };
      pills.appendChild(b);
    });
    var cur = CHAINS.filter(function (c) { return c.id === selected; })[0];
    document.getElementById('fulladdr').textContent = cur.name + ' · ' + cur.addr;
  }

  document.getElementById('copyaddr').onclick = function () {
    var cur = CHAINS.filter(function (c) { return c.id === selected; })[0];
    var text = cur.addr;
    var btn = this;
    function ok() { btn.textContent = '✓ ' + T('copied', 'คัดลอกแล้ว'); setTimeout(function () { btn.textContent = '⧉ ' + T('Copy address', 'คัดลอกที่อยู่'); }, 1600); }
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(ok);
    else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok(); }
  };

  document.getElementById('tog-en').onclick = function () { apply('en'); };
  document.getElementById('tog-th').onclick = function () { apply('th'); };
  apply(L);
})();
</script>
